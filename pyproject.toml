[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "safesql-mcp"
version = "0.1.0"
description = "A safe text-to-SQL MCP server for Postgres, with an agent, adversarial evals and a CI gate."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Chaitanya Kharche" }]
keywords = ["mcp", "text-to-sql", "postgres", "llm", "agents", "evals", "security"]
dependencies = [
  "mcp>=2.3,<3",
  "sqlglot>=30,<31",
  "psycopg[binary,pool]>=3.2,<4",
  "anthropic>=1.13,<2",
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
safesql = "safesql.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/safesql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "db: needs a running Postgres (set SAFESQL_ADMIN_URL / SAFESQL_DATABASE_URL)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
